version: 2
updates:
  # 1. NPM / PNPM Ecosystem
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Grouping logic to reduce PR noise
    groups:
      # Group 1: Batch all security updates into one PR
      security-batch:
        applies-to: security-updates
        patterns:
          - "*"
      # Group 2: Batch the Radix UI primitives — this repo's largest single
      # dependency cluster, and the main source of one-PR-per-package lockfile
      # churn (each was landing separately, colliding with every other branch
      # that also touched package.json/pnpm-lock.yaml).
      radix-ui:
        patterns:
          - "@radix-ui/*"
      # Group 3: Batch all other dev dependencies together
      dev-tools:
        dependency-type: "development"
        exclude-patterns:
          - "typescript" # Keep TS separate to monitor build breaks
      # Group 4: Everything else runtime — catches whatever isn't Radix or a
      # dev dependency, so routine bumps land as one weekly PR instead of many.
      runtime-deps:
        dependency-type: "production"

  # 2. GitHub Actions Ecosystem
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-batch:
        patterns:
          - "*"
