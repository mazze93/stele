# CodeQL analysis — satisfies the branch ruleset's required Code Scanning
# results (the rule predated any configured scanner, which blocked ALL merges;
# see stratum data/stele-trace.jsonl st-001).
#
# Scope choices (deliberate, GUARDIAN posture):
#   - javascript-typescript: the app (src/), stele-core, site/ inline JS
#   - actions: workflow files are attack surface (untrusted-input injection)
#   - security-extended: broader security queries; this is a security tool,
#     accept more findings-noise in exchange for recall
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
