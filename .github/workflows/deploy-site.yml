name: deploy-site

# Deploys stele.mazzeleczzare.com (Cloudflare Pages project "stele") from a
# committed revision of main, so what is live can always be named by a commit.
# Manual only, and inert until the repository has the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets. The "production" environment can be given
# required reviewers in the repository settings for a second approval step.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Public examples match the production gate
        run: node site/check-story.mjs
      - name: Install zsh for site/assemble.zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: zsh site/assemble.zsh
      - name: Install wrangler (pinned by stele-core's lockfile)
        run: npm ci --prefix stele-core
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npm exec --prefix stele-core --no -- wrangler pages deploy site/deploy
          --project-name=stele --branch=main --commit-hash="$GITHUB_SHA"
