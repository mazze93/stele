name: typecheck
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `tsc --noEmit` alone is a no-op here: the root tsconfig.json is a
      # solution file (`"files": []` + `references`), so a non-`-b` invocation
      # compiles zero files and exits 0 no matter what `src/` contains. It was
      # green against a deliberate type error. `-b` walks the referenced
      # projects and checks all 1401 files, cold or warm.
      - run: npx tsc -b --noEmit
      - run: pnpm lint
      - run: pnpm test
      - name: Assurance evidence writer regression checks
        run: node --test evals/assurance-integrity/evidence.test.mjs
      - name: Assurance integrity adversarial experiment
        run: node evals/assurance-integrity/run.mjs
      - name: Public integrity examples match the production gate
        run: node site/check-story.mjs

  # stele-core is a separate package with its own lockfile (npm, not pnpm) and
  # was not covered by CI at all — it reached main with live type errors once
  # already, and it now holds the /api/* auth perimeter and the audit chain,
  # which is the last code in this repo that should go unchecked.
  stele-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stele-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stele-core/package-lock.json
      - run: npm ci
      # The Prisma client is generated, gitignored, and required for tsc to
      # resolve the model types — without this step the typecheck fails on a
      # fresh checkout for a reason that has nothing to do with the code.
      # `prisma generate` never connects to the database, but prisma.config.ts
      # resolves env("DATABASE_URL") eagerly and throws if it is missing, so a
      # syntactically valid placeholder is required. It is never dialled.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npx tsc --noEmit
      # No database required — the suite covers the chain encoding, the /api/*
      # perimeter, the schema invariants, and the write-conflict classifier,
      # all of which are pure or exercised through Hono's request handler.
      - run: npm test

  gate-runner-pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve pinned gate and runner
        id: pins
        run: |
          python3 - <<'PY_PINS'
          import json, os
          pins = json.load(open('evals/pairing-lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('aletheia', 'apatea'):
                  output.write(f"{name}={pins[name]['revision']}\n")
          PY_PINS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mazze93/apatea
          ref: ${{ steps.pins.outputs.apatea }}
          path: .closure/apatea
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: mazze93/aletheia
          ref: ${{ steps.pins.outputs.aletheia }}
          path: .closure/aletheia
      - run: PYTHONPATH=src:. python3 -m unittest discover -v
        working-directory: .closure/apatea
      - run: PYTHONPATH=src:. python3 -m unittest discover -v
        working-directory: .closure/aletheia
      - name: Gate and runner agree under the declared perimeter
        run: |
          PYTHONPATH=.closure/apatea/src:.closure/apatea ALETHEIA_HOME="$PWD/.closure/aletheia" python3 -m apatea.cli --target aletheia
          python3 evals/pairing.py --apatea .closure/apatea
