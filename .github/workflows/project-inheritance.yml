name: project-inheritance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  pull_request:
    paths:
      - 'scripts/collect-projects.py'
      - 'src/data/project-sources.json'
      - '.github/workflows/project-inheritance.yml'

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Collect public repository observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect-projects.py --output observations/project-observations.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate observations at the application boundary
        env:
          STELE_OBSERVATIONS: observations/project-observations.json
        run: pnpm exec vitest run src/lib/__tests__/project-observations.test.ts
      - name: Record collection scope
        run: |
          {
            echo 'Public repository metadata and revision-pinned source links for philosopher-scribe review.'
            echo 'Download the artifact and load project-observations.json in the Collaborator panel.'
            echo 'Repository descriptions are author statements. Applying a draft requires session review.'
            sha256sum observations/project-observations.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stele-project-observations
          path: observations/project-observations.json
          if-no-files-found: error
