name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip Dependabot PRs. GitHub resolves `secrets.*` on a Dependabot-authored
    # PR against the *Dependabot* secret store, not Actions secrets, so
    # CLAUDE_CODE_OAUTH_TOKEN is empty there and the job fails auth in seconds —
    # a permanent red check on every dependency bump, which is noise, not signal.
    # Reviewing mechanical lockfile bumps adds little over `tsc` + Dependabot's
    # own advisory data. To restore review on bot PRs instead of skipping it,
    # add CLAUDE_CODE_OAUTH_TOKEN to the repo's Dependabot secrets and drop
    # this guard — deliberately NOT done, since duplicating a credential into a
    # second store widens credential surface (GUARDIAN posture).
    if: github.actor != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

