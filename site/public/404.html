<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Not found — STELE</title>
<link rel="icon" href="/app/favicon.svg" type="image/svg+xml">
<style>
/* A real 404 page also stops Pages from answering unknown paths
   (robots.txt, llms.txt, typos) with the landing page and a 200. */
:root{--stone:#e9e3d5;--ink:#211e1a;--ink-soft:#4d473d;--cinnabar:#a8392a;--cinnabar-deep:#8a2c20;--gold:#8c6a3a;}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--stone);color:var(--ink);
  font-family:system-ui,sans-serif;line-height:1.6;padding:24px;}
main{max-width:34rem;}
p.code{font-family:ui-monospace,monospace;letter-spacing:.12em;color:var(--cinnabar-deep);margin:0 0 .6em;}
h1{font-family:Georgia,serif;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;margin:0 0 .5em;}
p{color:var(--ink-soft);margin:0 0 1.4em;}
a{color:var(--cinnabar-deep);text-underline-offset:3px;}
a:focus-visible{outline:3px solid var(--gold);outline-offset:4px;}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Nothing is inscribed here.</h1>
  <p>This address doesn’t match a page on the STELE site.</p>
  <p><a href="/">Go to the STELE home page</a> or <a href="/app/">open the compiler</a>.</p>
</main>
</body>
</html>
